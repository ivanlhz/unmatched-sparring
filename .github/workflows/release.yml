# A tag `v<version>` builds the Windows installer the same way `npm run dist` does locally
# (launcher/scripts/build-bot.js: uv + PyInstaller for the bot, then electron-builder NSIS) and keeps it as a
# workflow artifact. Nothing is published: the GitHub Release is created by hand from the downloaded installer.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
    env:
      # the installer is not code-signed (README): do not let electron-builder look for a certificate
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: The tag must match launcher/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match launcher/package.json version $version" >&2
            exit 1
          fi

      # build-bot.js runs `uv run --python 3.11 --with pyinstaller==...`: uv fetches Python and PyInstaller itself
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: launcher/scripts/build-bot.js

      - run: npm ci

      - name: Build the bot and the installer
        run: npm run dist

      - name: Check the bundle
        shell: bash
        run: |
          bot=build/bot-dist/sparring-bot
          for file in sparring-bot.exe _internal/config/table.json _internal/config/map_setups.json _internal/data/i18n/es.json _internal/data/heroes/ciri.json _internal/data/heroes/eredin.json _internal/data/heroes/sinbad.json _internal/data/heroes/yennefer-triss.json _internal/data/heroes/triss-yennefer.json _internal/data/tts/ciri.json _internal/data/tts/eredin.json _internal/data/tts/sinbad.json _internal/data/tts/yennefer-triss.json _internal/data/tts/triss-yennefer.json; do
            if [ ! -f "$bot/$file" ]; then echo "Missing in the bot bundle: $file" >&2; exit 1; fi
          done
          "$bot/sparring-bot.exe" --help > /dev/null
          ls -l dist/UnmatchedSparring-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: UnmatchedSparring-Setup
          path: launcher/dist/UnmatchedSparring-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
