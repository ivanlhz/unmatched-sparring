# Every push and pull request to master runs the bot's pytest suite and the launcher's node tests.
# Windows only: the bot and the launcher target Windows, and the tests talk to a fake TTS over local sockets.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Bot (pytest)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run the suite
        run: python -m pytest -q -p no:cacheprovider

  launcher:
    name: Launcher (node --test)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - run: npm ci
      - run: npm test
